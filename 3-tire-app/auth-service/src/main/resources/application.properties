server.port=8081

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/authdb}
spring.datasource.username=${DB_USER:app}
spring.datasource.password=${DB_PASSWORD:app}

# Code first: Hibernate creates/updates tables from the @Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:change-me-this-is-a-dev-secret-at-least-32-bytes}
jwt.expiration-minutes=120
