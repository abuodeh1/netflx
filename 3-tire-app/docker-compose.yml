services:
  postgres:
    container_name: postgres
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: authdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d authdb"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  auth-service:
    container_name: auth-service
    build: ./auth-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/authdb
      DB_USER: app
      DB_PASSWORD: app
      JWT_SECRET: ${JWT_SECRET:-change-me-this-is-a-dev-secret-at-least-32-bytes}
    # ports:
    #   - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - frontend
      - backend

  todo-service:
    container_name: todo-service
    build: ./todo-service
    environment:
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=todosdb;Username=app;Password=app
      Jwt__Secret: ${JWT_SECRET:-change-me-this-is-a-dev-secret-at-least-32-bytes}
    # ports:
    #   - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - frontend
      - backend

  frontend:
    container_name: frontend
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - auth-service
      - todo-service
    networks:
      - frontend

networks:
  frontend:
  backend:

volumes:
  pgdata:




