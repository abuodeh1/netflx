# This file is bind-mounted into the nginx container.
# Edit it on the host, then run: docker compose exec nginx nginx -s reload

upstream react_app {
    server react-app;    # service name from docker-compose.yml
}

upstream next_app {
    server next-app;
}

server {
    listen 80;
    server_name localhost;

    # Next.js app (basePath is /next)
    location /next {
        proxy_pass http://next_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React app (everything else)
    location / {
        proxy_pass http://react_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
