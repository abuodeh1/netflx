server {
  listen 80;
  root /usr/share/nginx/html;

  # Allow the host shell to load remoteEntry.js and chunks cross-origin
  add_header Access-Control-Allow-Origin "*" always;
  add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
  add_header Access-Control-Allow-Headers "*" always;

  # remoteEntry.js must never be cached, otherwise the shell keeps loading an old version
  location = /mfe/auth/assets/remoteEntry.js {
    alias /usr/share/nginx/html/assets/remoteEntry.js;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Access-Control-Allow-Origin "*" always;
  }

  location /mfe/auth/assets/ {
    alias /usr/share/nginx/html/assets/;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Access-Control-Allow-Origin "*" always;
  }

  location /mfe/auth/ {
    alias /usr/share/nginx/html/;
    try_files $uri $uri/ /index.html;
  }
}